plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forgefit.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.forgefit.app'
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName '1.3.0-beta.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // This output is intentionally unsigned. Sign outside Gradle, using the
            // owner's private keystore, before attaching it to a GitHub Release.
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
